<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send me the post</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #faf9f6;
    color: #1a1a1a;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .card { width: 100%; max-width: 600px; }
  label { display: block; font-weight: 600; margin: 0 0 10px; }
  input {
    width: 100%;
    font-size: 18px;
    padding: 18px 20px;
    border: 1px solid #e5e2da;
    border-radius: 12px;
    background: #fff;
    margin-bottom: 24px;
    outline: none;
  }
  input:focus { border-color: #1f4fd8; }
  button {
    width: 100%;
    font-size: 18px;
    padding: 18px;
    border: 0;
    border-radius: 10px;
    background: #1f4fd8;
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .msg {
    display: none;
    margin-top: 24px;
    padding: 16px 20px;
    border-radius: 12px;
    font-size: 17px;
    line-height: 1.5;
  }
  .msg.ok  { display: block; background: #e6f4ea; color: #1e6b34; }
  .msg.err { display: block; background: #fdecea; color: #a12622; }
</style>
</head>
<body>
  <form class="card" id="postForm">
    <label for="topic">Topic</label>
    <input id="topic" name="topic" placeholder="e.g. UPI in India" required>

    <label for="email">Your email</label>
    <input id="email" name="email" type="email" placeholder="you@example.com" required>

    <button type="submit" id="submitBtn">Send me the post</button>

    <div class="msg" id="msg" role="status"></div>
  </form>

<script>
  // Webhook URL is hardcoded here; the settings panel has been removed.
  const WEBHOOK_URL = 'https://vasimsap1.app.n8n.cloud/webhook/fae426dd-774a-4348-8848-ff6beeaba6f2';

  const form = document.getElementById('postForm');
  const btn  = document.getElementById('submitBtn');
  const msg  = document.getElementById('msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';
    btn.disabled = true;
    btn.textContent = 'Sending…';

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          topic: form.topic.value.trim(),
          email: form.email.value.trim(),
        }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      msg.textContent = 'Done! The agents are working on it. Check your inbox in a minute or two.';
      msg.className = 'msg ok';
      form.reset();
    } catch (err) {
      msg.textContent = 'Something went wrong. Please try again in a moment.';
      msg.className = 'msg err';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send me the post';
    }
  });
</script>
</body>
</html>
